name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint + format
        run: bun run check

      # No test runner wired yet. When you add one (e.g. Vitest), expose a
      # `test` script and uncomment:
      # - name: Tests
      #   run: bun run test
